[package]
name = "datafusion-plugins-python"
description = "Python bindings (datafusion-python FFI) for datafusion-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "_internal"
crate-type = ["cdylib"]

[dependencies]
datafusion-plugins = { path = "../crates/datafusion-plugins" }
datafusion = { workspace = true }
datafusion-ffi = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
pyo3 = { version = "0.29", features = ["abi3-py311", "extension-module"] }
